name: Ci Pipeline


on:
  push:
    branches: [main]


jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set Up Node JS
        uses: actions/setup-node@v4
        with: 
          node-version: 24

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test



 